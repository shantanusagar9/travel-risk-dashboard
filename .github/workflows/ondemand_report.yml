name: On-Demand Travel Risk Report

on:
  workflow_dispatch:
    inputs:
      country:
        description: 'Country name (e.g. Spain, Japan, Kenya)'
        required: true
        type: string

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies for WeasyPrint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libpangocairo-1.0-0 \
            libcairo2 \
            libgdk-pixbuf2.0-0 \
            libffi-dev \
            shared-mime-info \
            fonts-liberation \
            fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate report
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          COUNTRY_NAME: ${{ github.event.inputs.country }}
        run: python generate_ondemand_report.py

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: travel-advisory-${{ github.event.inputs.country }}
          path: "Travel_Advisory_*.pdf"
          retention-days: 30
